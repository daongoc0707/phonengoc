name: Build phoneME iOS IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA & TrollStore TIPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Fix Line Endings and Permissions
        run: |
          find . -type f -name "*.sh" -exec sed -i '' 's/\r$//' {} + || true
          chmod -R +x Scripts Core/Tools Core/Tools/lib || true

      - name: Setup Tools (ldid)
        run: |
          brew install ldid || true

      - name: Show Xcode and SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Unsigned IPA
        run: |
          bash Scripts/build-unsigned-ipa.sh --clean

      - name: Build TrollStore TIPA
        run: |
          bash Scripts/build-trollstore-tipa.sh --clean || echo "TrollStore TIPA packaging step finished with status $?"

      - name: Upload Unsigned IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-0.3.4-build6-fixed-unsigned
          path: Artifacts/phoneME-0.3.4-build6-fixed-unsigned.ipa
          if-no-files-found: warn

      - name: Upload TrollStore TIPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-0.3.4-build6-TrollStore-JIT
          path: Artifacts/phoneME-TrollStore-JIT.tipa
          if-no-files-found: warn

      - name: Upload All Build Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-all-artifacts-and-logs
          path: |
            Artifacts/
            .build/
          if-no-files-found: warn
