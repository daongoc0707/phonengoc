name: Build phoneME iOS IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA & TrollStore TIPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ripgrep ldid

      - name: Fix Line Endings and Permissions
        run: |
          find . -type f \( -name "*.sh" -o -name "*.plist" -o -name "*.strings" -o -name "*.swift" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" -o -name "*.pbxproj" \) -exec sed -i '' 's/\r$//' {} + || true
          chmod -R +x Scripts Core/Tools Core/Tools/lib || true

      - name: Show Xcode and Tool Info
        run: |
          xcodebuild -version
          rg --version
          ldid || true

      - name: Build Unsigned IPA
        run: |
          bash Scripts/build-unsigned-ipa.sh --clean

      - name: Build TrollStore TIPA
        run: |
          bash Scripts/build-trollstore-tipa.sh --clean || echo "TrollStore TIPA build finished"

      - name: Upload Unsigned IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-0.3.4-build6-fixed-unsigned
          path: Artifacts/phoneME-0.3.4-build6-fixed-unsigned.ipa
          if-no-files-found: warn

      - name: Upload TrollStore TIPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-0.3.4-build6-TrollStore-JIT
          path: Artifacts/phoneME-TrollStore-JIT.tipa
          if-no-files-found: warn

      - name: Upload All Build Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-all-artifacts-and-logs
          path: |
            Artifacts/
            .build/
          if-no-files-found: warn
